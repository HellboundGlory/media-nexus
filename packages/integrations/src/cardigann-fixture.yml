# New-shape fixture (D4 Stage 1): rows/fields blocks + Go-template substitution.
name: MockPrivateTracker
description: A simple Cardigann-style definition used in tests
settings:
  - name: baseUrl
    type: text
    label: Site URL
    default: https://tracker.example
  - name: apikey
    type: password
    label: API key
search:
  paths:
    - path: /browse.php
      method: get
      inputs:
        q: "{{ .Keywords }}"
        apikey: "{{ .Config.apikey }}"
  rows:
    selector: tr.torrent
    filters:
      - name: andmatch
  fields:
    title:
      selector: td.name a
    details:
      selector: td.name a
      attribute: href
    download:
      selector: td.name a
      attribute: href
    size:
      selector: td.size
    seeders:
      selector: td.seeders
    category:
      text: 1000
