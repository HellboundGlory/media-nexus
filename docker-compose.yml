# MediaNexus — `docker compose up -d`
# Set MEDIA_NEXUS_SECRET in .env (copy from .env.example) before first run.
# Single container: the API serves the web UI directly. Never publish this port
# to the public internet — there is no login/auth beyond one system API key.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 7373
      DATABASE_URL: file:/data/db/media-nexus.db
      MEDIA_NEXUS_DATA_DIR: /data/config
      MEDIA_NEXUS_MEDIA_DIR: /data/media
      MEDIA_NEXUS_DOWNLOADS_DIR: /data/downloads
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      MEDIA_NEXUS_SECRET: ${MEDIA_NEXUS_SECRET:?set MEDIA_NEXUS_SECRET in .env}
    volumes:
      - ./data/db:/data/db
      - ./data/config:/data/config
      - ./data/media:/data/media
      - ./data/downloads:/data/downloads
    ports:
      - "${WEB_PORT:-8080}:7373"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7373/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  # ./data/* bind mounts provide persistence for DB, config, media and downloads.
  # Media + downloads must share a filesystem for hardlinks (import pipeline).
