# MediaNexus — recommended deployment: Postgres + Gluetun VPN.
#
# 1) Copy docker/.env.example to docker/.env (same directory) and fill it in.
# 2) docker compose -f docker/docker-compose.example.yml up -d
# 3) First-run API key: docker compose -f docker/docker-compose.example.yml logs media-nexus | grep "API key"
# 4) Open http://host:7373, paste the key under System → API key, then set root folder(s),
#    downloads root, and metadata.tmdbApiKey under System → Settings.
#
# LAN/private-network use only. Replace `hellboundglory/media-nexus` if you own the image elsewhere.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: media-nexus-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - media-nexus
    environment:
      # WireGuard shown — see https://github.com/qdm12/gluetun/wiki for other providers.
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?set your VPN provider in .env}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set your WireGuard private key in .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?set your WireGuard address in .env}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      # DoT stays on (gluetun's default) — postgres uses a static IP + extra_hosts below, never DNS.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:-192.168.1.0/24},172.28.0.0/24 # LAN + this docker net
    ports:
      - "${WEB_PORT:-7373}:7373" # published here — media-nexus has no ports of its own
      - "${NZBGET_PORT:-6789}:6789" # nzbget's web UI, same reason
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: media-nexus-postgres
    networks:
      media-nexus:
        ipv4_address: 172.28.0.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medianexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medianexus}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medianexus} -d ${POSTGRES_DB:-medianexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nzbget:
    image: ghcr.io/nzbgetcom/nzbget:latest
    container_name: media-nexus-nzbget
    network_mode: "service:gluetun" # shares gluetun's netns too — media-nexus reaches it at 127.0.0.1:6789, no DNS needed
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      NZBGET_USER: ${NZBGET_USER:?set NZBGET_USER in .env}
      NZBGET_PASS: ${NZBGET_PASS:?set NZBGET_PASS in .env}
    volumes:
      - ./data/nzbget:/config
      - ./data/downloads:/downloads # same path media-nexus mounts, so imports can hardlink
    restart: unless-stopped

  media-nexus:
    image: ghcr.io/hellboundglory/media-nexus/app:latest
    container_name: media-nexus-app
    restart: unless-stopped
    network_mode: "service:gluetun" # shares gluetun's netns — no networks:/ports: here
    extra_hosts:
      - "postgres:172.28.0.10" # matches postgres's static IP above
    depends_on:
      gluetun:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ${MN_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 7373
      DATABASE_URL: postgres://${POSTGRES_USER:-medianexus}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-medianexus}
      MEDIA_NEXUS_SECRET: ${MEDIA_NEXUS_SECRET:?set MEDIA_NEXUS_SECRET in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/config:/data/config
      - ./data/media:/data/media # media + downloads must share a filesystem for hardlinks
      - ./data/downloads:/data/downloads
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:7373/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 20s

networks:
  media-nexus:
    name: media-nexus
    ipam:
      config:
        - subnet: 172.28.0.0/24 # change if this collides with an existing network on your host
