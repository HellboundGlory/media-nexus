# MediaNexus — recommended deployment: Postgres + Gluetun VPN
#
# All outbound traffic from `media-nexus` (indexers, trackers, download clients, TMDB) is routed
# through a VPN tunnel via Gluetun, and the database is Postgres instead of the SQLite default.
#
# 1) Copy docker/.env.example to docker/.env (same directory as this file) and fill it in.
# 2) `docker compose -f docker/docker-compose.example.yml up -d`
# 3) Get the first-run API key: `docker compose -f docker/docker-compose.example.yml logs media-nexus | grep "API key"`
# 4) Open http://host:7373, paste the key under System → API key, then set root folder(s) to
#    /data/media, downloads root to /data/downloads, and metadata.tmdbApiKey (all in System →
#    Settings — runtime settings, not env vars).
#
# Image pulled from GHCR (published by CI on `v*` tags) — replace `hellboundglory/media-nexus` if
# you own the repo under a different path. LAN/private-network use only — no login/auth beyond
# one system API key; do not put this behind a public reverse proxy.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: media-nexus-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - media-nexus
    environment:
      # WireGuard shown — see https://github.com/qdm12/gluetun/wiki for OpenVPN or a different
      # provider's exact variable names.
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?set your VPN provider in .env}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set your WireGuard private key in .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?set your WireGuard address in .env}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      # Gluetun's DNS-over-TLS resolver can't see Docker's internal service names, which breaks
      # `media-nexus`'s ability to resolve `postgres` — turn it off.
      DOT: "off"
      # Let LAN + Docker-internal traffic through unencrypted, so the published web UI and
      # `postgres` both stay reachable without being forced through the tunnel.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:-192.168.1.0/24}
    ports:
      - "${WEB_PORT:-7373}:7373" # web UI — published here since `media-nexus` shares this netns
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: media-nexus-postgres
    networks:
      - media-nexus
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medianexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medianexus}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medianexus} -d ${POSTGRES_DB:-medianexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-nexus:
    image: ghcr.io/hellboundglory/media-nexus/app:latest
    container_name: media-nexus-app
    restart: unless-stopped
    network_mode: "service:gluetun" # no networks:/ports: here — shares gluetun's netns instead
    depends_on:
      gluetun:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ${MN_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 7373
      DATABASE_URL: postgres://${POSTGRES_USER:-medianexus}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-medianexus}
      MEDIA_NEXUS_SECRET: ${MEDIA_NEXUS_SECRET:?set MEDIA_NEXUS_SECRET in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/config:/data/config
      # media + downloads MUST share a filesystem for hardlink imports
      - ./data/media:/data/media
      - ./data/downloads:/data/downloads
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:7373/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 20s

networks:
  media-nexus:
    name: media-nexus
