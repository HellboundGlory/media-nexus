# MediaNexus web — nginx
# Hardened: the API hostname is resolved at REQUEST time via a variable + Docker's
# embedded DNS (127.0.0.11), so nginx does NOT emerg/restart-loop when the `api`
# service is briefly unreachable at startup ("host not found in upstream").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # API / health reverse proxy to the api container (request-time resolution)
    location /api/ {
        set $api_upstream http://api:7373;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health {
        set $api_upstream http://api:7373;
        proxy_pass $api_upstream;
    }
    location /health/ {
        set $api_upstream http://api:7373;
        proxy_pass $api_upstream;
    }

    # SPA fallback
    location / { try_files $uri $uri/ /index.html; }

    # security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer;
}
